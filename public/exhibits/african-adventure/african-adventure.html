<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>African Adventure</title>
</head>
<body>
    <header class="fcz-site-header">
        <div class="fcz-header-container">
          <a href="../../../index.html" class="fcz-logo-link" aria-label="Fresno Chaffee Zoo Home">
            <img src="fczlogo.jpg" alt="Fresno Chaffee Zoo Logo" class="fcz-logo">
          </a>
          <nav class="fcz-main-nav" aria-label="Main Navigation">
            <ul class="fcz-nav-list">
              <li><a href="../../../index.html" class="fcz-nav-link">Home</a></li>
              <li><a href="../index.html" class="fcz-nav-link active">Exhibit Portal</a></li>
              <li><a href="https://fcz.org/plan-your-visit/" class="fcz-nav-link" target="_blank" rel="noopener">Plan Your Visit</a></li>
            </ul>
          </nav>
        </div>
      </header>
      
    <main>
        <section id="hero-video">
            <video id="video-main" src="" width="100vw" height="100vh" alt="Video displaying various areas and activities at Fresno Chaffee Zoo"></video>
        </section>

        <section id="popular-animals">
            <h2>Popular Animals</h2>
            <section class="pop-card">
                <img class="pop-img" src="Lion2WWF.jpg" alt="Lion">
            </section>
            <section class="pop-card">
                <img class="pop-img" src="Addaxious.jpg" alt="Addax">
            </section>
            <section class="pop-card">
                <img class="pop-img" src="" alt="">
            </section>
        </section>

        <section id="animal-news">
            <img id="news-img" src="" alt="">
            <p id="news-text"></p>
        </section>

        <section id="featured-animals">
            <h2>Featured Animals</h2>
            <section class="featured-card">
                <img class="featured-img" src="" alt="">
                <h3></h3>
            </section>
            <section class="featured-card">
                <img class="featured-img" src="" alt="">
                <h3></h3>
            </section>
            <section class="featured-card">
                <img class="featured-img" src="" alt="">
                <h3></h3>
            </section>
            <section class="featured-card">
                <img class="featured-img" src="" alt="">
                <h3></h3>
            </section>
        </section>

        <section id="all-animals">
            <section id="animals-top">
                <h2>All Animals</h2>
            </section>
            <section id="all-animal-cards">
                <section class="card1">
                    <h3>African Lion</h3>
                </section>
                <section class="card2">
                    <h3>Addax</h3> 
                </section>
                <section class="card3">
                    <h3>African Elephant</h3>
                </section>
                <section class="card4">
                    <h3>Impala</h3>
                </section>
                <section class="card5">
                    <h3>Reticulated Giraffe</h3>
                </section>
                <section class="card6">
                    <h3>Masai Giraffe</h3>
                </section>
                <section class="card7">
                    <h3>Slender Horned Gazelle</h3>
                </section>
                <section class="card8">
                    <h3>Cheetah</h3>
                </section>
                <section class="card9">
                    <h3>Meerkat</h3>
                </section>
                <section class="card10">
                    <h3>Warthog</h3>
                </section>
                <section class="card11">
                    <h3>Kudu</h3>
                </section>
                <section class="card12">
                    <h3>Common Ostrich</h3>
                </section>
                <section class="card13">
                    <h3>Southern White Rhino</h3>
                </section>
                <section class="card14">
                    <h3>Wildebeest</h3>
                </section>
            </section>
        </section>
    </main>
    <footer>
        
    </footer>
</body>
</html>
